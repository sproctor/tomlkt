name: Publish

on:
  workflow_dispatch:

env:
  # Publishing group, supplied as a repo variable so the namespace is not
  # committed (mirrors the local override in ~/.gradle/gradle.properties).
  ORG_GRADLE_PROJECT_group: ${{ vars.MAVEN_GROUP }}
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Publish
        run: ./gradlew core:publishAndReleaseToMavenCentral --stacktrace
