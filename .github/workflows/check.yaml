name: Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Check
        run: ./gradlew core:check
